name: Linux Ubuntu driver
on:
  push:
    paths: ['Linux/**', 'tests/**', 'tools/**', 'releases/**', 'install-ubuntu.sh', '.dockerignore', '.github/workflows/linux.yml']
  pull_request:
    paths: ['Linux/**', 'tests/**', 'tools/**', 'releases/**', 'install-ubuntu.sh', '.dockerignore', '.github/workflows/linux.yml']
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable Ubuntu test environment
        run: docker build -f tests/Dockerfile -t linuxusbdisplay-test .
      - name: Compile and test install / uninstall without loading modules
        run: docker run --rm linuxusbdisplay-test
      - name: Package Linux sources
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: LinuxUsbDisplay-Ubuntu
          path: dist/*
